name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a build manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Bundle Vosk language models into APK assets
        run: |
          mkdir -p app/src/main/assets/vosk_models

          # Helper: try each URL in order, retry up to 3 times each, fail hard if all fail.
          fetch() {
            local dest="app/src/main/assets/vosk_models/$1.zip"
            shift
            for url in "$@"; do
              echo "  → $url"
              if curl -L -f --retry 3 --retry-delay 5 --max-time 300 -o "$dest" "$url"; then
                local size
                size=$(du -sh "$dest" | cut -f1)
                echo "  ✓ $dest ($size)"
                return 0
              fi
              echo "  ✗ failed, trying next URL..."
            done
            echo "ERROR: all URLs failed for $1" >&2
            exit 1
          }

          fetch english    "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" \
                           "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.22.zip"
          fetch spanish    "https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip"
          fetch french     "https://alphacephei.com/vosk/models/vosk-model-small-fr-pguyot-0.3.zip"
          fetch german     "https://alphacephei.com/vosk/models/vosk-model-small-de-0.15.zip"
          fetch russian    "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip"
          fetch portuguese "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip"
          fetch italian    "https://alphacephei.com/vosk/models/vosk-model-small-it-0.22.zip"
          fetch chinese    "https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip"
          fetch hindi      "https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip"
          fetch dutch      "https://alphacephei.com/vosk/models/vosk-model-small-nl-0.22.zip"
          fetch turkish    "https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip"
          fetch korean     "https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip"
          # Bulgarian: try small model first, fall back to full model (~200 MB) if unavailable
          fetch bulgarian  "https://alphacephei.com/vosk/models/vosk-model-small-bg-0.22.zip" \
                           "https://alphacephei.com/vosk/models/vosk-model-bg-0.22.zip"

          echo "=== All models bundled ==="
          ls -lh app/src/main/assets/vosk_models/

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioTranscriber-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publish to GitHub Releases using gh CLI
      # Download from: github.com/<you>/AudioTranscriber/releases/latest
      - name: Publish to GitHub Releases
        run: |
          # Delete release and remote tag (belt + suspenders)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          sleep 5
          gh release create latest \
            --title "Latest Build" \
            --notes "Auto-built from main branch. Download **app-debug.apk** below, then on your phone go to Settings > Security > Install unknown apps, allow your browser, and open the APK to install." \
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
