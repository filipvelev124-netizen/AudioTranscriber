name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a build manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioTranscriber-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publish to GitHub Releases using gh CLI (avoids softprops race condition)
      # Download from: github.com/<you>/AudioTranscriber/releases/latest
      - name: Publish to GitHub Releases
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          sleep 5
          cat > /tmp/release_notes.md << 'EOF'
          Automatically built from the latest code on `main`.

          ## How to install on your phone
          1. Download **app-debug.apk** below
          2. On your phone: **Settings → Security → Install unknown apps** → allow your browser
          3. Open the downloaded APK and tap Install
          EOF
          gh release create latest \
            --title "Latest Build" \
            --notes-file /tmp/release_notes.md \
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
