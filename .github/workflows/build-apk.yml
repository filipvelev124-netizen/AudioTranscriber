name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a build manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Bundle Vosk language models into APK assets
        run: |
          mkdir -p app/src/main/assets/vosk_models

          # Download 12 models in parallel — fast on GitHub Actions runners
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/english.zip    https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip   &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/spanish.zip    https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip      &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/french.zip     https://alphacephei.com/vosk/models/vosk-model-small-fr-pguyot-0.3.zip &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/german.zip     https://alphacephei.com/vosk/models/vosk-model-small-de-0.15.zip      &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/russian.zip    https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip      &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/portuguese.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip       &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/italian.zip    https://alphacephei.com/vosk/models/vosk-model-small-it-0.22.zip      &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/chinese.zip    https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip      &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/hindi.zip      https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip      &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/dutch.zip      https://alphacephei.com/vosk/models/vosk-model-small-nl-0.22.zip      &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/turkish.zip    https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip       &
          curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/korean.zip     https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip      &
          # Bulgarian: try small model, fall back to full model in same background slot
          (curl -L --retry 2 --max-time 300 -o app/src/main/assets/vosk_models/bulgarian.zip \
               https://alphacephei.com/vosk/models/vosk-model-small-bg-0.22.zip \
           || curl -L --retry 3 --max-time 300 -o app/src/main/assets/vosk_models/bulgarian.zip \
               https://alphacephei.com/vosk/models/vosk-model-bg-0.22.zip) &
          wait

          echo "=== Downloaded files ==="
          ls -lh app/src/main/assets/vosk_models/

          # Verify every model is present and at least 5 MB — fail the build if any is missing
          PASS=true
          for lang in english spanish french german russian portuguese italian chinese hindi dutch turkish korean bulgarian; do
            f="app/src/main/assets/vosk_models/${lang}.zip"
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -lt 5000000 ]; then
              echo "FAIL: ${lang}.zip missing or corrupt (${size} bytes)"
              PASS=false
            else
              echo "  OK: $lang — $((size/1024/1024)) MB"
            fi
          done
          $PASS || { echo "One or more models failed to download — aborting build"; exit 1; }

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioTranscriber-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Publish to GitHub Releases using gh CLI
      # Download from: github.com/<you>/AudioTranscriber/releases/latest
      - name: Publish to GitHub Releases
        run: |
          # Delete release and remote tag (belt + suspenders)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          sleep 5
          gh release create latest \
            --title "Latest Build" \
            --notes "Auto-built from main branch. Download **app-debug.apk** below, then on your phone go to Settings > Security > Install unknown apps, allow your browser, and open the APK to install." \
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
